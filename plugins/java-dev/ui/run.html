<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Esegui e debug</title>
<!--
  «Esegui e debug» del plugin Java Dev (docs/plugin-contributi.md): configurazioni, servizi e JDK, e durante il debug
  stack, variabili, espressioni e console. Parla con l'adapter del plugin (plugin.call) e ne riceve gli eventi
  (debug, output, progress, state, breakpoints). L'app non sa nulla di Java.
-->
<style>
  :root { --cct-bg:#09090b; --cct-surface:#18181b; --cct-surface-2:#1f1f23; --cct-border:#27272a; --cct-border-strong:#3f3f46; --cct-text:#fafafa; --cct-text-muted:#a1a1aa; --cct-text-faint:#71717a; --cct-accent:#e8875f; --cct-on-accent:#1a0f0a; --cct-ok:#6fd39b; --cct-warn:#f5c46b; --cct-danger:#ff8a8a; --cct-info:#6ea8fe; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--cct-surface); color: var(--cct-text-muted); font: 12px/1.35 system-ui, sans-serif; }
  body { overflow-y: auto; }
  button, select, input, textarea { font: inherit; color: var(--cct-text); }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  button:disabled { opacity: .4; cursor: default; }
  .sel, .inp { height: 28px; min-width: 0; border: 1px solid var(--cct-border-strong); border-radius: 6px; background: var(--cct-bg); padding: 0 6px; outline: none; }
  .sel:focus, .inp:focus { border-color: var(--cct-accent); }
  textarea.inp { height: 80px; padding: 6px; font-family: ui-monospace, monospace; resize: vertical; }
  .mono { font-family: ui-monospace, monospace; font-size: 11px; }
  .ibtn { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; border-radius: 6px; color: var(--cct-text-muted); padding: 0 4px; }
  .ibtn:hover:not(:disabled) { background: var(--cct-border); color: var(--cct-text); }
  .ok { color: var(--cct-ok); } .brand { color: var(--cct-accent); } .danger { color: var(--cct-danger); } .info { color: var(--cct-info); } .faint { color: var(--cct-text-faint); } .strong { color: var(--cct-text); }
  section { border-bottom: 1px solid var(--cct-border); }
  .sh { display: flex; align-items: center; gap: 4px; height: 28px; padding: 0 6px; }
  .sh > button.title { flex: 1; text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--cct-text-muted); }
  .sb { padding-bottom: 8px; }
  .row { display: flex; align-items: center; gap: 6px; padding: 0 12px; min-height: 22px; }
  .row:hover { background: var(--cct-surface-2); }
  .row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .row .hov { display: none; } .row:hover .hov { display: inline-flex; }
  .sel-row { background: var(--cct-surface-2); }
  .note { padding: 3px 12px; font-size: 11px; color: var(--cct-text-faint); }
  .pill { border: 1px solid var(--cct-border); border-radius: 4px; padding: 0 4px; font-size: 10px; color: var(--cct-text-muted); }
  .pill.fw { border-color: color-mix(in srgb, var(--cct-accent) 50%, transparent); color: var(--cct-accent); }
  .bar { padding: 8px; border-bottom: 1px solid var(--cct-border); display: flex; flex-direction: column; gap: 6px; }
  .line { display: flex; gap: 4px; align-items: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #log { max-height: 160px; overflow: auto; padding: 0 12px; white-space: pre-wrap; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: flex-start; justify-content: center; padding: 16px 8px; overflow: auto; z-index: 5; }
  .dlg { width: 100%; max-width: 540px; background: var(--cct-surface); border: 1px solid var(--cct-border-strong); border-radius: 10px; padding: 14px; }
  .dlg h3 { margin: 0 0 4px; font-size: 14px; color: var(--cct-text); }
  .fld { display: block; margin-top: 10px; } .fld > span { display: block; margin-bottom: 3px; font-size: 11px; color: var(--cct-text-faint); }
  .fld .inp, .fld .sel { width: 100%; }
  .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .btn { height: 30px; padding: 0 14px; border-radius: 6px; } .btn.pri { background: var(--cct-accent); color: var(--cct-on-accent); font-weight: 600; } .btn.sec { color: var(--cct-text-muted); } .btn.sec:hover { background: var(--cct-border); }
  .warn { margin-top: 10px; padding: 8px; border: 1px solid color-mix(in srgb, var(--cct-warn) 40%, transparent); background: color-mix(in srgb, var(--cct-warn) 10%, transparent); border-radius: 6px; color: var(--cct-warn); font-size: 11px; }
</style>
</head>
<body>
<div id="app" style="display:none">
  <div class="bar">
    <div class="line"><select id="cfgsel" class="sel" style="flex:1"></select><button id="runbtn" class="ibtn ok" title="Esegui (senza debug)">▶</button><button id="dbgbtn" class="ibtn brand" title="Avvia in debug">🐞︎</button></div>
    <div id="ctl" class="line" style="display:none">
      <button class="ibtn" data-ctl="continue" title="Continua">▶</button><button class="ibtn" data-ctl="pause" title="Pausa">⏸</button><button class="ibtn" data-ctl="next" title="Passo successivo (step over)">⤼</button><button class="ibtn" data-ctl="stepIn" title="Entra (step into)">↴</button><button class="ibtn" data-ctl="stepOut" title="Esci (step out)">↑</button><button class="ibtn" id="restart" title="Riavvia">↻</button><button class="ibtn danger" id="stop" title="Ferma il debug">■</button>
    </div>
    <p id="status" style="margin:0;min-height:16px;font-size:11px" role="status"></p>
  </div>
  <div id="progress" style="display:none;border-bottom:1px solid var(--cct-border);padding:6px 12px;font-size:11px"></div>
  <div id="debugsecs" style="display:none">
    <section id="s-stack"><div class="sh"><button class="title" data-sec="stack">▾ Stack</button></div><div class="sb" id="stack"></div></section>
    <section id="s-vars"><div class="sh"><button class="title" data-sec="vars">▾ Variabili</button></div><div class="sb" id="vars"></div></section>
  </div>
  <section id="s-console" style="display:none"><div class="sh"><button class="title" data-sec="console">▾ Console di debug</button></div><div class="sb" id="console">
    <div id="log" class="mono"></div><div style="padding:6px 8px 0"><input id="expr" class="inp mono" style="width:100%" spellcheck="false" aria-label="Espressione da valutare"></div></div></section>
  <section><div class="sh"><button class="title" data-sec="bps">▾ Breakpoint</button><button class="ibtn" id="clearbps" title="Togli tutti">🗑︎</button></div><div class="sb" id="bps"></div></section>
  <section><div class="sh"><button class="title" data-sec="cfgs">▾ Configurazioni</button><button class="ibtn" id="import" title="Importa da IntelliJ IDEA">⇪</button><button class="ibtn" id="newcfg" title="Nuova configurazione">＋</button></div><div class="sb" id="cfgs"></div></section>
  <section><div class="sh"><button class="title" data-sec="svcs">▾ Servizi Java</button><button class="ibtn" id="refresh" title="Cerca di nuovo">↻</button></div><div class="sb" id="svcs"></div></section>
  <section><div class="sh"><button class="title" data-sec="jdks">▾ JDK</button></div><div class="sb" id="jdks"></div></section>
</div>
<p id="loading" class="note" style="padding:16px">Caricamento…</p>
<div id="modal"></div>
<script>
'use strict'
// ---- Ponte con l'app ----
let ctx = { win: false, cwd: '' }
const pending = new Map(); let nextId = 1
const rpc = (method, params) => new Promise((res, rej) => { const id = nextId++; pending.set(id, { res, rej }); parent.postMessage({ cct: 'rpc', id, method, params }, '*') })
const call = (method, params = {}) => rpc('plugin.call', { method, params })
window.addEventListener('message', (e) => {
  const m = e.data
  if (!m || typeof m !== 'object') return
  if (m.cct === 'rpc-result') { const p = pending.get(m.id); pending.delete(m.id); if (p) m.ok ? p.res(m.value) : p.rej(new Error(m.error || 'errore')) }
  else if (m.cct === 'init') {
    const first = !ctx.cwd; const changed = ctx.cwd !== m.cwd
    ctx = { win: !!m.win, cwd: m.cwd }
    for (const [k, v] of Object.entries(m.theme || {})) if (v) document.documentElement.style.setProperty(k, v)
    if (first || changed) boot()
  } else if (m.cct === 'event') onEvent(m.event, m.data)
})

// ---- Stato ----
const TEMURIN = [8, 11, 17, 21, 25]
const S = { state: null, debug: { status: 'idle', frames: [], verified: {} }, bps: {}, progress: null, output: [], evals: [], selected: '', frameIdx: 0, note: '', closed: new Set() }
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const base = (p) => String(p).split(/[\\/]/).pop()
const active = () => ['starting', 'running', 'paused'].includes(S.debug.status)
const jdkLabel = (j) => `${j.vendor || 'JDK'} ${j.version}${j.source === 'temurin' ? ' (scaricato)' : ''}`
const openAt = (path, line) => rpc('editor.open', { path, line }).catch(() => {})

async function boot() {
  $('loading').style.display = 'none'; $('app').style.display = ''
  try { S.debug = await call('debugState'); S.bps = await call('breakpoints') } catch {}
  await refresh()
}
async function refresh(fresh) {
  try { S.state = await call('state', { root: ctx.cwd, fresh: !!fresh }) } catch (e) { S.note = e.message }
  renderAll()
}
function onEvent(ev, data) {
  if (ev === 'state') refresh()
  else if (ev === 'debug') {
    const prev = S.debug; S.debug = data
    if (data.message && (data.status === 'terminated' || data.status === 'starting')) say('● ' + data.message)
    if (prev.frames[0]?.id !== data.frames[0]?.id) S.frameIdx = 0
    renderDebug()
  } else if (ev === 'output') { say(String(data.text).replace(/\r?\n$/, '')) }
  else if (ev === 'progress') {
    S.progress = data; renderProgress()
    if (data.done || data.error) setTimeout(() => { S.progress = null; renderProgress(); renderJdks() }, data.error ? 6000 : 1500)
  } else if (ev === 'breakpoints') { S.bps = data || {}; renderBps() }
}
function say(line) { S.output = [...S.output, line].slice(-1000); renderLog() }

// ---- Disegno ----
function renderAll() { renderBar(); renderProgress(); renderDebug(); renderBps(); renderCfgs(); renderSvcs(); renderJdks() }
function section(id, bodyId, show) { const body = $(bodyId); const sec = body.closest('section'); const t = sec.querySelector('.title'); const closed = S.closed.has(id); body.style.display = closed ? 'none' : ''; t.textContent = (closed ? '▸ ' : '▾ ') + t.textContent.slice(2) }
function configs() { return S.state?.configs ?? [] }
function current() { const c = configs(); return c.find((x) => x.id === S.selected) ?? c[0] }

function renderBar() {
  const c = configs(); const cur = current(); const act = active()
  const sel = $('cfgsel')
  sel.innerHTML = c.length ? c.map((x) => `<option value="${esc(x.id)}"${cur?.id === x.id ? ' selected' : ''}>${esc(x.name)}</option>`).join('') : '<option value="">Nessuna configurazione</option>'
  sel.disabled = act || !c.length
  $('runbtn').disabled = !cur || act || cur.type === 'attach'
  $('dbgbtn').disabled = !cur || act
  const st = S.debug
  const text = S.note || st.message || (st.status === 'paused' ? `Fermo${st.reason ? ` (${st.reason})` : ''}${st.frames[S.frameIdx] ? ' · ' + st.frames[S.frameIdx].name : ''}` : st.status === 'running' ? 'In esecuzione' : '')
  const el = $('status'); el.textContent = text; el.className = S.note || (st.status === 'terminated' && st.message) ? 'danger' : 'faint'
  $('ctl').style.display = act ? 'flex' : 'none'
  for (const b of document.querySelectorAll('[data-ctl]')) b.disabled = b.dataset.ctl === 'pause' ? st.status !== 'running' : st.status !== 'paused'
}
function renderProgress() {
  const p = S.progress; const el = $('progress')
  if (!p || p.done) { el.style.display = 'none'; return }
  el.style.display = ''; el.innerHTML = p.error ? `<span class="danger">${esc(p.error)}</span>` : `${esc(p.step)} · ${Math.round(p.progress * 100)}%`
}
function renderDebug() {
  renderBar()
  const act = active(); const st = S.debug
  $('debugsecs').style.display = act && st.status === 'paused' ? '' : 'none'
  $('s-console').style.display = act ? '' : 'none'
  $('expr').disabled = st.status !== 'paused'
  $('expr').placeholder = st.status === 'paused' ? "Valuta un'espressione…" : 'Disponibile quando il programma è fermo'
  if (act && st.status === 'paused') {
    $('stack').innerHTML = st.frames.map((f, i) => `<button class="row mono" data-frame="${i}" style="width:100%;${i === S.frameIdx ? 'background:var(--cct-border);color:var(--cct-text)' : ''}"><span class="grow">${esc(f.name)}</span><span class="faint">${esc(f.path ? base(f.path) + ':' + f.line : f.line)}</span></button>`).join('')
    loadVars()
  }
  renderLog(); section('stack', 'stack'); section('vars', 'vars'); section('console', 'console')
}
function renderLog() {
  const log = $('log')
  log.innerHTML = S.output.map((l) => `<div class="${l.startsWith('●') ? 'faint' : ''}">${esc(l)}</div>`).join('') + S.evals.map((e) => `<div class="${e.error ? 'danger' : 'info'}">&gt; ${esc(e.expr)}<div style="padding-left:12px;color:var(--cct-text-muted)">${esc(e.text)}</div></div>`).join('')
  log.scrollTop = log.scrollHeight
}
// Variabili: albero con i figli caricati all'apertura del nodo.
async function loadVars() {
  const box = $('vars'); const f = S.debug.frames[S.frameIdx]; const key = f ? `${f.id}:${f.line}` : ''
  box.dataset.key = key; box.innerHTML = ''
  if (!f) return
  let list = []
  try { for (const sc of await call('scopes', { frameId: f.id })) list = list.concat(await call('variables', { ref: sc.ref })) } catch {}
  if (box.dataset.key !== key) return
  if (!list.length) { box.innerHTML = '<p class="note">Nessuna variabile.</p>'; return }
  for (const v of list) box.appendChild(varNode(v, 0))
}
function varNode(v, depth) {
  const wrap = document.createElement('div'); const row = document.createElement('button')
  row.className = 'row mono'; row.style.cssText = `width:100%;padding-left:${6 + depth * 12}px;min-height:21px`; row.title = v.type || ''
  row.innerHTML = `<span style="width:12px" class="faint">${v.ref ? '▸' : ''}</span><span class="info">${esc(v.name)}</span><span class="faint">=</span><span class="grow">${esc(v.value)}</span>`
  const kids = document.createElement('div'); let loaded = false, open = false
  row.onclick = async () => {
    if (!v.ref) return
    open = !open; row.firstChild.textContent = open ? '▾' : '▸'
    if (open && !loaded) { loaded = true; try { for (const k of await call('variables', { ref: v.ref })) kids.appendChild(varNode(k, depth + 1)) } catch {} }
    kids.style.display = open ? '' : 'none'
  }
  kids.style.display = 'none'; wrap.append(row, kids); return wrap
}
function renderBps() {
  const list = Object.entries(S.bps).flatMap(([file, l]) => l.map((b) => ({ file, ...b })))
  $('clearbps').style.display = list.length ? '' : 'none'
  $('bps').innerHTML = list.length ? list.map((b, i) => `<div class="row"><span class="danger">●</span><button class="grow mono" data-bp="${i}">${esc(base(b.file))}:${b.line}</button><button class="ibtn hov" data-rmbp="${i}" title="Togli il breakpoint">🗑︎</button></div>`).join('') : '<p class="note">Clicca nel margine sinistro di un file .java per metterne uno.</p>'
  $('bps')._list = list; section('bps', 'bps')
}
function renderCfgs() {
  const c = configs(); const cur = current()
  $('cfgs').innerHTML = c.length ? c.map((x) => `<div class="row ${x.id === cur?.id ? 'sel-row' : ''}" style="min-height:26px"><button class="grow strong" data-pick="${esc(x.id)}" title="${esc(x.root)}">${esc(x.name)} <span class="faint" style="font-size:10.5px">${esc(x.type)}${x.origin === 'intellij' ? ' · IntelliJ' : ''}</span></button><button class="ibtn hov" data-edit="${esc(x.id)}" title="Modifica">✎</button><button class="ibtn hov" data-del="${esc(x.id)}" title="Elimina">🗑︎</button></div>`).join('') : '<p class="note">Nessuna configurazione: creane una con «＋» o importale da IntelliJ.</p>'
  section('cfgs', 'cfgs')
}
function jdkOptions(sel) { return (S.state?.jdks ?? []).map((j) => `<option value="${esc(j.id)}"${sel === j.id ? ' selected' : ''}>${esc(jdkLabel(j))}</option>`).join('') }
function renderSvcs() {
  const sv = S.state?.services ?? []
  $('svcs').innerHTML = sv.length ? sv.map((s) => `<div style="padding:4px 12px 4px ${s.parent ? 22 : 12}px"><div class="line"><span class="strong" style="font-weight:500;overflow:hidden;text-overflow:ellipsis" title="${esc(s.root)}">${esc(s.name)}</span><span class="pill">${esc(s.build)}</span>${s.framework !== 'plain' ? `<span class="pill fw">${esc(s.framework)}</span>` : ''}${s.aggregator ? '<span class="faint" style="font-size:10px">contenitore</span>' : ''}${s.javaVersion ? `<span class="faint" style="margin-left:auto;font-size:10px">Java ${esc(s.javaVersion)}</span>` : ''}</div>${s.aggregator ? '' : `<select class="sel" style="width:100%;margin-top:4px" data-svcjdk="${esc(s.root)}"><option value="">JDK predefinito</option>${jdkOptions(S.state.serviceJdk[s.id])}</select>`}</div>`).join('') : '<p class="note">Nessun pom.xml o build.gradle in questa cartella.</p>'
  section('svcs', 'svcs')
}
function renderJdks() {
  const st = S.state; if (!st) return
  const busy = S.progress && !S.progress.done && !S.progress.error
  $('jdks').innerHTML = `<div style="padding:0 12px 4px"><select class="sel" style="width:100%" id="defjdk"><option value="">Predefinito: il più adatto al servizio</option>${jdkOptions(st.defaultJdk)}</select></div>` +
    st.jdks.map((j) => `<div class="row" style="min-height:24px"><span class="grow" title="${esc(j.path)}">${esc(jdkLabel(j))}</span><span class="faint" style="font-size:10px">${j.source === 'temurin' ? 'app' : esc(j.source)}</span>${j.source === 'temurin' ? `<button class="ibtn hov" data-rmjdk="${esc(j.id)}" title="Rimuovi">🗑︎</button>` : ''}</div>`).join('') +
    `<p class="note" style="color:var(--cct-text-muted)">Scarica Eclipse Temurin:</p><div style="display:flex;flex-wrap:wrap;gap:4px;padding:0 12px">${TEMURIN.map((m) => `<button class="pill" style="height:24px;padding:0 8px" data-dl="${m}" ${st.jdks.some((j) => j.source === 'temurin' && j.major === m) || busy ? 'disabled' : ''}>⬇ ${m}</button>`).join('')}</div>`
  section('jdks', 'jdks')
}

// ---- Interazione ----
document.addEventListener('click', async (e) => {
  const t = e.target.closest('button'); if (!t) return
  const d = t.dataset
  if (d.sec) { S.closed.has(d.sec) ? S.closed.delete(d.sec) : S.closed.add(d.sec); renderAll(); return }
  if (d.ctl) return act(call('control', { action: d.ctl }))
  if (d.frame !== undefined) { S.frameIdx = Number(d.frame); const f = S.debug.frames[S.frameIdx]; renderDebug(); if (f?.path) openAt(f.path, f.line); return }
  if (d.bp !== undefined) { const b = $('bps')._list[d.bp]; openAt(b.file, b.line); return }
  if (d.rmbp !== undefined) { const b = $('bps')._list[d.rmbp]; return removeBp(b.file, b.line) }
  if (d.pick) { S.selected = d.pick; renderBar(); renderCfgs(); return }
  if (d.edit) return openConfig(configs().find((c) => c.id === d.edit))
  if (d.del) { await call('deleteConfig', { id: d.del }); return }
  if (d.rmjdk) { await call('removeJdk', { id: d.rmjdk }); return }
  if (d.dl) { act(call('downloadJdk', { major: Number(d.dl) })); return }
})
async function act(p) { try { const r = await p; S.note = r && r.ok === false && r.error ? r.error : '' } catch (e) { S.note = e.message } renderBar() }
function removeBp(file, line) { const list = (S.bps[file] || []).filter((b) => b.line !== line); return call('setBreakpoints', { file, list }) }
$('runbtn').onclick = () => { const c = current(); if (c) { S.note = ''; act(call('run', { id: c.id, workspace: ctx.cwd })) } }
$('dbgbtn').onclick = () => { const c = current(); if (c) { S.note = ''; act(call('debug', { id: c.id, workspace: ctx.cwd })) } }
$('restart').onclick = () => act(call('restart'))
$('stop').onclick = () => act(call('stop'))
$('cfgsel').onchange = (e) => { S.selected = e.target.value; renderCfgs(); renderBar() }
$('refresh').onclick = () => refresh(true)
$('newcfg').onclick = () => openConfig(null)
$('clearbps').onclick = async () => { for (const [file] of Object.entries(S.bps)) await call('setBreakpoints', { file, list: [] }) }
$('import').onclick = async () => { try { showImport(await call('importIdea', { root: ctx.cwd })) } catch (e) { S.note = e.message; renderBar() } }
document.addEventListener('change', (e) => {
  const t = e.target
  if (t.dataset.svcjdk !== undefined) call('setServiceJdk', { root: t.dataset.svcjdk, id: t.value || null })
  else if (t.id === 'defjdk') call('setDefaultJdk', { id: t.value || null })
})
$('expr').addEventListener('keydown', async (e) => {
  if (e.key !== 'Enter') return
  const ex = e.target.value.trim(); if (!ex) return
  e.target.value = ''
  try { const r = await call('evaluate', { expression: ex, frameId: S.debug.frames[S.frameIdx]?.id }); S.evals = [...S.evals, { expr: ex, text: r.ok ? r.result ?? '' : r.error ?? 'Errore', error: !r.ok }].slice(-40) } catch (err) { S.evals = [...S.evals, { expr: ex, text: err.message, error: true }] }
  renderLog()
})

// ---- Finestre: configurazione e importazione ----
const TYPES = [['quarkus', 'Quarkus (dev mode)'], ['maven', 'Maven'], ['gradle', 'Gradle'], ['application', 'Applicazione Java'], ['attach', 'Collegati a una JVM (attach)']]
const envToText = (env) => Object.entries(env || {}).map(([k, v]) => `${k}=${v}`).join('\n')
const textToEnv = (t) => { const o = {}; for (const l of t.split(/\r?\n/)) { const m = /^\s*([^=\s#][^=]*?)\s*=(.*)$/.exec(l); if (m) o[m[1]] = m[2] } return o }
function closeModal() { $('modal').innerHTML = '' }
function openConfig(initial) {
  const sv = S.state.services; const first = sv.find((s) => !s.aggregator) || sv[0]
  const cfg = initial ? JSON.parse(JSON.stringify(initial)) : { id: '', name: '', type: first?.framework === 'quarkus' ? 'quarkus' : first?.build === 'gradle' ? 'gradle' : 'maven', root: first?.root ?? ctx.cwd, env: {}, vmOptions: '', args: '', debugPort: 5005, tool: first?.build, origin: 'manuale' }
  const draw = () => {
    const att = cfg.type === 'attach'
    const svc = sv.find((s) => s.root.toLowerCase() === cfg.root.toLowerCase())
    const f = (label, html, hint) => `<label class="fld"><span>${label}</span>${html}${hint ? `<span style="margin:2px 0 0;font-size:10.5px">${hint}</span>` : ''}</label>`
    const inp = (k, ph, type) => `<input class="inp" data-k="${k}" ${type ? `type="${type}"` : ''} value="${esc(cfg[k] ?? '')}" placeholder="${esc(ph || '')}" spellcheck="false">`
    $('modal').innerHTML = `<div class="modal"><div class="dlg" role="dialog"><h3>${initial ? 'Modifica configurazione' : 'Nuova configurazione'}</h3><div class="faint">Come avviare (e debuggare) un servizio Java.</div>
      <div class="grid2">${f('Nome', inp('name', 'api [quarkus:dev]'))}${f('Tipo', `<select class="sel" data-k="type">${TYPES.map(([id, l]) => `<option value="${id}"${cfg.type === id ? ' selected' : ''}>${l}</option>`).join('')}</select>`)}</div>
      ${f(att ? 'Cartella del progetto (per i sorgenti)' : 'Servizio / cartella di lavoro', `<div class="line">${sv.length ? `<select class="sel" style="width:190px;flex:none" data-svc><option value="">Altra cartella…</option>${sv.map((s) => `<option value="${esc(s.root)}"${svc?.root === s.root ? ' selected' : ''}>${esc(s.name)} (${esc(s.build)}${s.framework !== 'plain' ? ', ' + esc(s.framework) : ''})</option>`).join('')}</select>` : ''}${inp('root')}</div>`)}
      ${cfg.type === 'maven' ? `<div class="grid2">${f('Obiettivi', inp('goals', 'clean package'))}${f('Profili (virgola)', inp('profiles', 'dev,local'))}</div>` : ''}
      ${cfg.type === 'gradle' ? f('Task', inp('tasks', 'bootRun')) : ''}
      ${cfg.type === 'quarkus' ? f('Avvio con', `<select class="sel" data-k="tool"><option value="maven"${cfg.tool !== 'gradle' ? ' selected' : ''}>Maven (quarkus:dev)</option><option value="gradle"${cfg.tool === 'gradle' ? ' selected' : ''}>Gradle (quarkusDev)</option></select>`) : ''}
      ${cfg.type === 'application' ? f('Classe con il main', inp('mainClass', 'com.acme.App'), 'Il classpath arriva dal language server Java: il progetto deve essere importato.') : ''}
      ${att ? `<div class="grid2">${f('Host', inp('host', 'localhost'))}${f('Porta', inp('port', '5005', 'number'))}</div>` : `
        <div class="grid2">${f('Opzioni della JVM', inp('vmOptions', '-Xmx1g -Dquarkus.profile=dev'))}${f('Argomenti', inp('args', '-DskipTests'))}</div>
        <div class="grid2">${f('JDK', `<select class="sel" data-k="jdk"><option value="">Quello del servizio / predefinito</option>${jdkOptions(cfg.jdk)}</select>`)}${f('Porta di debug', inp('debugPort', '', 'number'))}</div>
        ${f("Variabili d'ambiente (una per riga: NOME=valore)", `<textarea class="inp" id="envtxt" spellcheck="false">${esc(envToText(cfg.env))}</textarea>`)}`}
      <div class="acts"><button class="btn sec" id="cancel">Annulla</button><button class="btn pri" id="save">Salva</button></div></div></div>`
    const valid = () => cfg.name.trim() && cfg.root.trim() && (cfg.type !== 'application' || (cfg.mainClass || '').trim()) && (cfg.type !== 'maven' || (cfg.goals || '').trim()) && (cfg.type !== 'gradle' || (cfg.tasks || '').trim())
    const sync = () => { $('save').disabled = !valid() }; sync()
    for (const el of $('modal').querySelectorAll('[data-k]')) el.oninput = el.onchange = () => {
      const k = el.dataset.k; let v = el.value
      if (['port', 'debugPort'].includes(k)) { v = Number(v) || 5005; if (k === 'port') cfg.debugPort = v }
      if (k === 'jdk' && !v) v = undefined
      cfg[k] = v
      if (k === 'type') draw(); else sync()
    }
    const pick = $('modal').querySelector('[data-svc]'); if (pick) pick.onchange = () => { if (pick.value) { cfg.root = pick.value; draw() } }
    $('cancel').onclick = closeModal
    $('save').onclick = async () => { const env = $('envtxt') ? textToEnv($('envtxt').value) : cfg.env; const saved = await call('saveConfig', { config: { ...cfg, name: cfg.name.trim(), env } }); S.selected = saved.id; closeModal() }
  }
  draw()
}
function showImport(res) {
  const picked = new Set(res.configs.map((c) => c.id))
  const draw = () => {
    $('modal').innerHTML = `<div class="modal"><div class="dlg" role="dialog"><h3>Importa da IntelliJ IDEA</h3><div class="faint">Run configuration trovate nel progetto (.idea/runConfigurations, .run, workspace.xml).</div>
      <div style="margin-top:10px">${res.configs.length ? res.configs.map((c) => `<label class="row" style="padding:6px 8px;align-items:flex-start;cursor:pointer"><input type="checkbox" data-id="${esc(c.id)}" ${picked.has(c.id) ? 'checked' : ''} style="margin-top:2px"><span style="min-width:0"><span class="strong" style="font-weight:500">${esc(c.name)}</span> <span class="faint">· ${esc(c.type)}</span><span class="mono faint" style="display:block;overflow:hidden;text-overflow:ellipsis">${esc(c.goals || c.tasks || c.mainClass || c.host + ':' + c.port)}</span></span></label>`).join('') : '<p class="note">Nessuna configurazione importabile.</p>'}</div>
      ${res.warnings.length ? `<ul class="warn">${res.warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
      <div class="acts"><button class="btn sec" id="cancel">Annulla</button><button class="btn pri" id="go" ${picked.size ? '' : 'disabled'}>Importa ${picked.size || ''}</button></div></div></div>`
    for (const cb of $('modal').querySelectorAll('[data-id]')) cb.onchange = () => { cb.checked ? picked.add(cb.dataset.id) : picked.delete(cb.dataset.id); draw() }
    $('cancel').onclick = closeModal
    $('go').onclick = async () => { for (const c of res.configs.filter((x) => picked.has(x.id))) await call('saveConfig', { config: c }); closeModal() }
  }
  draw()
}
parent.postMessage({ cct: 'ready' }, '*')
</script>
</body>
</html>
