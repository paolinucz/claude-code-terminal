<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: app:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' ws://localhost:*; frame-src app:"
    />
    <title>Magnolia</title>
    <!-- Schermata di avvio statica: compare subito, prima che il bundle dell'interfaccia sia caricato. La sostituisce, senza
         scatti, quella di React (components/Splash.tsx), che ha lo stesso aspetto e mostra l'avanzamento vero. -->
    <style>
      html, body { margin: 0; height: 100%; background: #09090b; }
      #boot { position: fixed; inset: 0; z-index: 150; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #09090b; font-family: system-ui, 'Segoe UI', sans-serif; -webkit-app-region: drag; }
      #boot::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 42%, rgb(22 130 148 / 0.22), transparent 52%); }
      #boot img { position: relative; width: 112px; height: 112px; filter: drop-shadow(0 12px 28px rgb(0 0 0 / 0.55)); }
      #boot h1 { position: relative; margin: 24px 0 0; font-size: 22px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #fafafa; }
      #boot .bar { position: relative; margin-top: 32px; width: 256px; height: 6px; border-radius: 999px; background: #1f1f23; overflow: hidden; }
      #boot .bar i { position: absolute; top: 0; bottom: 0; width: 35%; border-radius: 999px; background: linear-gradient(90deg, #168294, #459ba9); animation: cct-boot 1.2s ease-in-out infinite; }
      #boot p { position: relative; margin: 12px 0 0; height: 16px; font-size: 12px; color: #71717a; }
      @keyframes cct-boot { 0% { left: -35%; } 100% { left: 100%; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Caricamento di Magnolia">
      <img src="./src/assets/icon-detailed.svg" alt="" draggable="false" />
      <h1>Magnolia</h1>
      <div class="bar"><i></i></div>
      <p>Avvio…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
